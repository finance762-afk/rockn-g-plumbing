# Generated from .htaccess on 2026-10-18; include inside the server{} block for www.rockngplumbing.com at launch (PageOneBOT)
#
#   server {
#       server_name www.rockngplumbing.com;
#       ...
#       include /path/to/repo/deploy/nginx-redirects.conf;   # before the PHP location block
#       ...
#   }
#
# One hop to the final URL, mirroring every R=301 rule in .htaccess. Apache keeps the query string on these
# redirects (no QSD flag), so each return appends $is_args$args the same way.
# Exact-match locations (location = …) win over every prefix/regex location, so placement inside server{} only
# matters for the one regex location (/service-area/<town>), which must come before any `location ~ \.php$`.
#
# Sitemap: Apache rewrites /sitemap.xml -> /sitemap.php internally (not a redirect). On nginx the static
# /sitemap.xml in the repo root is served as a plain file, so no rule is needed. Regenerate sitemap.xml whenever
# a page or blog post is added (see the note in sitemap.php).

# ---- .php in the original request -> extensionless URL ---------------------------------------------------------
# .htaccess: RewriteCond %{THE_REQUEST} /([^.]+)\.php [NC]  /  RewriteRule ^ /%1 [NC,L,R=301]
# $request_uri is the original request line, so nginx's internal index.php lookup for "/" or "/about/" never loops.
if ($request_uri ~* "^/([^.?]+)\.php(?:\?|$)") {
    return 301 https://www.rockngplumbing.com/$1$is_args$args;
}

